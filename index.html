   <!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Huellitas Felices</title>

<style>

*{

  box-sizing:border-box;

  margin:0;

  padding:0;

  font-family:Arial,sans-serif;

}

body{

  background:#fff7fb;

  color:#333;

}

header{

  background:#f48fb1;

  color:white;

  padding:18px 25px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  position:sticky;

  top:0;

  z-index:10;

}

.logo{

  font-size:24px;

  font-weight:bold;

}

nav a{

  color:white;

  text-decoration:none;

  margin:0 8px;

  font-weight:bold;

}

.cart{

  background:white;

  color:#e85d91;

  padding:8px 12px;

  border-radius:20px;

  font-weight:bold;

}

.hero{

  text-align:center;

  padding:45px 20px;

  background:#ffd6e7;

}

.hero h1{

  color:#d94f83;

  font-size:38px;

  margin-bottom:10px;

}

.hero p{

  font-size:18px;

}

.container{

  max-width:1100px;

  margin:auto;

  padding:30px 20px;

}

h2{

  text-align:center;

  color:#d94f83;

  margin-bottom:25px;

}

.filters{

  display:flex;

  gap:10px;

  justify-content:center;

  flex-wrap:wrap;

  margin-bottom:30px;

}

input,select{

  padding:12px;

  border:2px solid #f3b5cb;

  border-radius:10px;

  outline:none;

}

.products{

  display:grid;

  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

  gap:22px;

}

.card{

  background:white;

  border-radius:18px;

  overflow:hidden;

  box-shadow:0 3px 12px rgba(0,0,0,.12);

  text-align:center;

  padding-bottom:18px;

}

.product-image{

  width:100%;

  height:190px;

  background:#ffe5ef;

  display:flex;

  align-items:center;

  justify-content:center;

}

.product-image svg{

  width:150px;

  height:150px;

}

.card h3{

  color:#d94f83;

  margin:15px 8px 8px;

}

.card p{

  color:#666;

  min-height:40px;

  padding:0 10px;

}

.price{

  display:block;

  color:#222;

  font-size:20px;

  font-weight:bold;

  margin:12px;

}

button{

  border:none;

  background:#e85d91;

  color:white;

  padding:11px 18px;

  border-radius:20px;

  cursor:pointer;

  font-weight:bold;

}

button:hover{

  background:#d94f83;

}

.contacto{

  margin-top:40px;

  background:#ffe5ef;

  padding:30px;

  border-radius:20px;

  text-align:center;

}

.contacto input{

  width:90%;

  max-width:500px;

  margin:6px;

}

footer{

  margin-top:40px;

  background:#d94f83;

  color:white;

  text-align:center;

  padding:25px;

}

#mensaje{

  position:fixed;

  bottom:20px;

  right:20px;

  background:#d94f83;

  color:white;

  padding:12px 18px;

  border-radius:20px;

  display:none;

  z-index:20;

}

</style>

</head>

<body>

<header>

  <div class="logo">🐾 Huellitas Felices</div>

  <nav>

    <a href="#inicio">Inicio</a>

    <a href="#productos">Productos</a>

    <a href="#contacto">Contacto</a>

  </nav>

  <div class="cart">

    🛒 Carrito: <span id="contador">0</span>

  </div>

</header>

<section class="hero" id="inicio">

  <h1>¡Todo para tu Peludito! 🐶</h1>

  <p>Productos para consentir y cuidar a nuestros mejores amigos.</p>

</section>

<main class="container" id="productos">

  <h2>🐾 Nuestros productos 🐾</h2>

  <div class="filters">

    <input

      type="text"

      id="buscar"

      placeholder="Buscar producto..."

      oninput="mostrarProductos()"

    >

    <select id="categoria" onchange="mostrarProductos()">

      <option value="todos">Todos</option>

      <option value="comida">Comida</option>

      <option value="juguetes">Juguetes</option>

      <option value="ropa">Ropa</option>

      <option value="camas">Camas</option>

      <option value="accesorios">Accesorios</option>

    </select>

  </div>

  <div class="products" id="listaProductos"></div>

  <section class="contacto" id="contacto">

    <h2>💗 Contáctanos</h2>

    <p>¿Tienes alguna pregunta? Escríbenos.</p>

    <br>

    <input type="text" id="nombre" placeholder="Tu nombre">

    <br>

    <input type="email" id="correo" placeholder="Tu correo">

    <br>

    <input type="text" id="mensajeContacto" placeholder="Escribe tu mensaje">

    <br><br>

    <button onclick="enviarMensaje()">Enviar mensaje</button>

  </section>

</main>

<footer>

  <p>🐾 Huellitas Felices 🐾</p>

  <p>Cuidamos con amor a quien alegra tu corazón 💗</p>

</footer>

<div id="mensaje"></div>

<script>

const productos = [

{

nombre:"Concentrado para Perros",

precio:45000,

categoria:"comida",

emoji:"🍖",

descripcion:"Alimento para consentir a tu peludito."

},

{

nombre:"Snacks de Huesitos",

precio:18000,

categoria:"comida",

emoji:"🦴",

descripcion:"Deliciosos premios para tu mascota."

},

{

nombre:"Pelota Rosada para Perrita",

precio:15000,

categoria:"juguetes",

emoji:"🎾",

descripcion:"Un juguete divertido para jugar."

},

{

nombre:"Juguete de Cuerda Rosado",

precio:22000,

categoria:"juguetes",

emoji:"🪢",

descripcion:"Ideal para jugar y entretener."

},

{

nombre:"Camiseta Rosada para Perrita",

precio:28000,

categoria:"ropa",

emoji:"👕",

descripcion:"Ropita cómoda y bonita."

},

{

nombre:"Cama Rosada para Mascota",

precio:85000,

categoria:"camas",

emoji:"🛏️",

descripcion:"Un lugar cómodo para descansar."

},

{

nombre:"Collar Rosado para Perro",

precio:30000,

categoria:"accesorios",

emoji:"🎀",

descripcion:"Bonito collar para tu mascota."

},

{

nombre:"Correa Rosada para Perro",

precio:35000,

categoria:"accesorios",

emoji:"🩷",

descripcion:"Para salir a pasear con seguridad."

},

{

nombre:"Arnés Rojo para Perro",

precio:45000,

categoria:"accesorios",

emoji:"❤️",

descripcion:"Cómodo para los paseos."

},

{

nombre:"Comedero Rosado",

precio:25000,

categoria:"accesorios",

emoji:"🥣",

descripcion:"Comedero práctico y bonito."

}

];

let carrito=0;

function imagenProducto(emoji){

return `

<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">

<circle cx="100" cy="100" r="82" fill="#ffd1e2"/>

<circle cx="100" cy="105" r="48" fill="#ffffff"/>

<circle cx="72" cy="75" r="22" fill="#ffffff"/>

<circle cx="128" cy="75" r="22" fill="#ffffff"/>

<circle cx="78" cy="100" r="6" fill="#333"/>

<circle cx="122" cy="100" r="6" fill="#333"/>

<ellipse cx="100" cy="120" rx="13" ry="10" fill="#333"/>

<text x="100" y="177"

text-anchor="middle"

font-size="30">${emoji}</text>

</svg>

`;

}

function mostrarProductos(){

const lista=document.getElementById("listaProductos");

const texto=document.getElementById("buscar").value.toLowerCase();

const categoria=document.getElementById("categoria").value;

lista.innerHTML="";

const filtrados=productos.filter(producto=>{

const coincideNombre=producto.nombre.toLowerCase().includes(texto);

const coincideCategoria=

categoria==="todos" ||

producto.categoria===categoria;

return coincideNombre && coincideCategoria;

});

if(filtrados.length===0){

lista.innerHTML="<p style='text-align:center;grid-column:1/-1;'>No encontramos ese producto 🐾</p>";

return;

}

filtrados.forEach(producto=>{

lista.innerHTML+=`

<div class="card">

<div class="product-image">

${imagenProducto(producto.emoji)}

</div>

<h3>${producto.nombre}</h3>

<p>${producto.descripcion}</p>

<span class="price">

$${producto.precio.toLocaleString("es-CO")}

</span>

<button onclick="agregarCarrito()">

Agregar al carrito 🛒

</button>

</div>

`;

});

}

function agregarCarrito(){

carrito++;

document.getElementById("contador").textContent=carrito;

mostrarMensaje("Producto agregado al carrito 🛒");

}

function mostrarMensaje(texto){

const mensaje=document.getElementById("mensaje");

mensaje.textContent=texto;

mensaje.style.display="block";

setTimeout(()=>{

mensaje.style.display="none";

},2000);

}

function enviarMensaje(){

const nombre=document.getElementById("nombre").value;

if(nombre.trim()===""){

mostrarMensaje("Escribe tu nombre primero 💗");

return;

}

mostrarMensaje("¡Mensaje enviado! Gracias por contactarnos 🐾");

}

mostrarProductos();
