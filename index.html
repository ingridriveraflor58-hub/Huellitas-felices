<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huellitas Felices</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background: #fff;
      color: #444;
      padding-bottom: 120px;
    }

    /* HEADER */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: white;
      padding: 15px 5%;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #ff85a2;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    nav a {
      margin-left: 15px;
      text-decoration: none;
      color: #709fb0;
      font-weight: bold;
      font-size: 14px;
    }

    .cart-btn-header {
      background: #ff85a2;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    /* HERO */
    .hero {
      margin-top: 70px;
      background: linear-gradient(135deg, #a0c4ff, #ffc6ff);
      color: white;
      text-align: center;
      padding: 60px 20px;
    }

    .hero h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 16px;
    }

    /* CATALOGO */
    .catalog {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .card-body {
      padding: 20px;
      text-align: center;
    }

    .card-title {
      font-size: 18px;
      color: #709fb0;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 13px;
      color: #777;
      margin-bottom: 15px;
      min-height: 36px;
    }

    .card-price {
      font-size: 20px;
      font-weight: bold;
      color: #ff85a2;
      margin-bottom: 15px;
    }

    .btn-add {
      background: #ff85a2;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      width: 100%;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-add:hover {
      background: #f76c8e;
    }

    /* CARRITO INFERIOR */
    .cart-drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: white;
      box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
      border-radius: 20px 20px 0 0;
      padding: 20px;
      z-index: 999;
      max-height: 80vh;
      overflow-y: auto;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .cart-header h3 {
      color: #ff85a2;
    }

    .cart-items {
      margin-bottom: 15px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    .cart-item-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cart-item-qty {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .cart-item-qty button {
      background: #e2eafc;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
      color: #709fb0;
    }

    .cart-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .total-price {
      font-size: 18px;
      font-weight: bold;
      color: #709fb0;
    }

    /* FORMULARIO CONTACTO */
    .contact-section {
      max-width: 600px;
      margin: 50px auto 20px;
      padding: 20px;
      background: #f8edeb;
      border-radius: 15px;
      text-align: center;
    }

    .contact-section h2 {
      color: #ff85a2;
      margin-bottom: 15px;
    }

    .contact-section input, .contact-section textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .contact-section button {
      background: #709fb0;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #888;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">🐾 Huellitas Felices</div>
    <nav>
      <a href="#inicio">Inicio</a>
      <a href="#productos">Productos</a>
      <a href="#contacto">Contacto</a>
    </nav>
    <button class="cart-btn-header" onclick="toggleCart()">🛒 <span id="cart-count">0</span></button>
  </header>

  <section id="inicio" class="hero">
    <h1>¡Todo para tu Peludito!</h1>
    <p>Encuentra los mejores accesorios, juguetes y alimento con envío a domicilio.</p>
  </section>

  <section id="productos" class="catalog" id="product-list"></section>

  <section id="contacto" class="contact-section">
    <h2>Contacto</h2>
    <form onsubmit="event.preventDefault(); alert('¡Mensaje enviado con éxito!');">
      <input type="text" placeholder="Tu Nombre" required>
      <input type="email" placeholder="Tu Correo" required>
      <textarea rows="4" placeholder="¿En qué podemos ayudarte?" required></textarea>
      <button type="submit">Enviar Mensaje</button>
    </form>
  </section>

  <div class="cart-drawer">
    <div class="cart-header">
      <h3>🛒 Mi Carrito</h3>
      <span style="font-size: 12px; color: #888;">(Haz clic en 🛒 arriba para ocultar/mostrar)</span>
    </div>
    <div class="cart-items" id="cart-items">
      <p style="text-align: center; color: #aaa; font-size: 14px;">El carrito está vacío</p>
    </div>
    <div class="cart-footer">
      <div class="total-price">Total: $<span id="cart-total">0</span></div>
      <button class="btn-add" style="width: auto;" onclick="checkout()">Finalizar Compra</button>
    </div>
  </div>

  <footer>
    &copy; 2026 Huellitas Felices - Proyecto Académico
  </footer>

  <script>
    const products = [
      {
        id: 1,
        title: "Cuerda Morder Canina",
        desc: "Ideal para la salud dental y limpiar sus dientes.",
        price: 22000,
        image: "https://images.unsplash.com/photo-1608408891486-ebb2376f272a?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 2,
        title: "Comedero Antivoracidad",
        desc: "Ayuda a mejorar la digestión comiendo más despacio.",
        price: 35000,
        image: "https://images.unsplash.com/photo-1541599540903-216a46ca1dc0?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 3,
        title: "Cama Suave Ergonómica",
        desc: "Máximo confort para el descanso de tu perro o gato.",
        price: 85000,
        image: "https://images.unsplash.com/photo-1591946614720-90a587da4a36?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 4,
        title: "Arnés Reflectivo Ajustable",
        desc: "Seguridad y comodidad para los paseos nocturnos.",
        price: 45000,
        image: "https://images.unsplash.com/photo-1535294435445-d7249524ef2e?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 5,
        title: "Rascador para Gatos",
        desc: "Protege tus muebles con este poste rascador resistente.",
        price: 60000,
        image: "https://images.unsplash.com/photo-1545249390-6bdfa286032f?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 6,
        title: "Snacks Naturales (100g)",
        desc: "Deliciosos premios saludables ricos en proteína.",
        price: 18000,
        image: "https://images.unsplash.com/photo-1582798358481-d199fb7347bb?auto=format&fit=crop&w=600&q=80"
      }
    ];

    let cart = [];

    function renderProducts() {
      const container = document.getElementById('product-list');
      container.innerHTML = products.map(p => `
        <div class="card">
          <img src="${p.image}" alt="${p.title}">
          <div class="card-body">
            <div class="card-title">${p.title}</div>
            <div class="card-desc">${p.desc}</div>
            <div class="card-price">$${p.price.toLocaleString('es-CO')}</div>
            <button class="btn-add" onclick="addToCart(${p.id})">🛒 Agregar</button>
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      const item = cart.find(item => item.id === id);
      if (item) {
        item.qty++;
      } else {
        cart.push({ ...product, qty: 1 });
      }
      updateCart();
    }

    function changeQty(id, delta) {
      const item = cart.find(item => item.id === id);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) {
          cart = cart.filter(i => i.id !== id);
        }
      }
      updateCart();
    }

    function updateCart() {
      const cartItemsContainer = document.getElementById('cart-items');
      const cartCount = document.getElementById('cart-count');
      const cartTotal = document.getElementById('cart-total');

      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      cartCount.innerText = totalCount;
      cartTotal.innerText = totalPrice.toLocaleString('es-CO');

      if (cart.length === 0) {
        cartItemsContainer.innerHTML = '<p style="text-align: center; color: #aaa; font-size: 14px;">El carrito está vacío</p>';
      } else {
        cartItemsContainer.innerHTML = cart.map(item => `
          <div class="cart-item">
            <div class="cart-item-info">
              <strong>${item.title}</strong>
              <span style="color:#888;">($${item.price.toLocaleString('es-CO')})</span>
            </div>
            <div class="cart-item-qty">
              <button onclick="changeQty(${item.id}, -1)">-</button>
              <span>${item.qty}</span>
              <button onclick="changeQty(${item.id}, 1)">+</button>
            </div>
          </div>
        `).join('');
      }
    }

    function checkout() {
      if (cart.length === 0) {
        alert("El carrito está vacío.");
        return;
      }
      alert("¡Gracias por tu compra! Tu pedido ha sido registrado.");
      cart = [];
      updateCart();
    }

    function toggleCart() {
      const drawer = document.querySelector('.cart-drawer');
      drawer.style.display = drawer.style.display === 'none' ? 'block' : 'none';
    }

    renderProducts();
  </script>
</body>
